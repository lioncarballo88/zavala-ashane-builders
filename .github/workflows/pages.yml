name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Only the public site goes into the artifact. Docs, tooling,
      # _source/, .htaccess and Netlify config stay in the repo unpublished.
      - name: Build site bundle
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html about.html our-impact.html \
             3824-mystic-circle.html 3814-treasure-island-drive.html \
             robots.txt sitemap.xml CNAME .nojekyll _site/
          cp -r assets _site/
          cp index.html _site/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
